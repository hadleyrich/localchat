[project]
name = "localchat"
version = "0.1.0"
description = "Home Assistant Local Chat Component"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "homeassistant==2025.7.0",
    "aiohttp>=3.8.0,<4.0.0",
    "voluptuous>=0.12.1,<1.0.0",
    "openai>=2.8.0",
    "demoji>=1.1.0",
    "webcolors>=24.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.13.2",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff==0.13.2",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
